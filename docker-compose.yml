
services:

  cbaims2-postgres:
    image: postgres:15-alpine
    container_name: cbaims2-postgres-db
    environment:
      POSTGRES_DB: cims_db_dev
      POSTGRES_USER: cims_user
      POSTGRES_PASSWORD: cims_password
    volumes:
      - cbaims2-postgres-data:/var/lib/postgresql/data
    networks:
      - cbaims2-network
    restart: unless-stopped

  cbaims-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cbaims-backend:cbaims2
    container_name: cbaims2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbaims2-postgres-db:5432/cims_db_dev
      SPRING_DATASOURCE_USERNAME: cims_user
      SPRING_DATASOURCE_PASSWORD: cims_password
      CIMS_CBS_MAX_POOL_SIZE: 10
      CIMS_CBS_MIN_IDLE: 2
      CIMS_CBS_READ_TIMEOUT_MS: 300000
      CIMS_CBS_FETCH_SIZE: 2000
    ports:
      - "8001:8082"
    depends_on:
      - cbaims2-postgres
    networks:
      - cbaims2-network
    restart: unless-stopped

  cbaims-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cbaims-frontend:cbaims2
    container_name: cbaims2-frontend
    ports:
      - "3001:80"
    depends_on:
      - cbaims-backend
    networks:
      - cbaims2-network
    restart: unless-stopped

networks:
  cbaims2-network:
    name: cbaims2-network
    driver: bridge

volumes:
  cbaims2-postgres-data:
    name: cbaims2-postgres-data
