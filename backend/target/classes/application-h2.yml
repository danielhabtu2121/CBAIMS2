server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: cims-backend
  datasource:
    url: jdbc:h2:mem:cims_db_dev;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS cbs_sim
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

flowable:
  async-executor-activate: false

cims:
  cbs:
    mode: SIMULATOR
    sync-mode: MANUAL
    scheduled-interval-ms: 3600000
    real:
      enabled: false
      base-url: ""
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      authentication-type: "NONE"

logging:
  level:
    org.hibernate.SQL: WARN
    com.bank.cims: INFO
