server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: cims-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://cims-postgres-db:5432/cims_db_dev}
    username: cims_user
    password: cims_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cims:
  cbs:
    mode: SIMULATOR
    sync-mode: MANUAL
    scheduled-interval-ms: 3600000
    real:
      enabled: false
      base-url: ""
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      authentication-type: "NONE"

logging:
  level:
    org.hibernate.SQL: INFO
    com.bank.cims: INFO
